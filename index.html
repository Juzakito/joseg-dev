<title>José González — Portafolio</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">

<style>
/* ============================================================
   ESCRITORIO WINDOWS VISTA AERO — Estilos
   ============================================================ */
:root{
  --taskbar-h: 44px;
  --glass-border: rgba(255,255,255,.65);
  --azul: #1e5fa8;
  --texto: #16324f;
}
*{ box-sizing: border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family: "Segoe UI", "Segoe UI Web", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea{ font-family: inherit; }
a{ color: var(--azul); }

/* ---------- Fondo Bliss ---------- */
#desktop{ position:fixed; inset:0; overflow:hidden; user-select:none; }
#wallpaper{
  position:absolute; inset:0; width:100%; height:100%; z-index:0;
  background: #145058 url('aurora.jpg') center center / cover no-repeat;
}
.watermark{
  position:absolute; right:18px; bottom:calc(var(--taskbar-h) + 12px); z-index:1;
  text-align:right; color:#eaf6ff; opacity:.85; font-size:11px; line-height:1.45;
  text-shadow:0 1px 3px rgba(0,20,60,.9); pointer-events:none;
}

/* ---------- Iconos del Escritorio ---------- */
#icon-col{
  position:absolute; top:12px; left:12px; z-index:10;
  display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;
  gap:4px; height:calc(100% - var(--taskbar-h) - 20px);
}
.dicon{
  width:84px; padding:6px 4px 5px; border-radius:6px; border:1px solid transparent;
  display:flex; flex-direction:column; align-items:center; gap:4px; cursor:default;
  transition:background .12s, border-color .12s;
}
.dicon svg{ width:48px; height:48px; filter:drop-shadow(0 3px 5px rgba(0,20,60,.45)); transition:transform .12s; }
.dicon:hover svg{ transform:scale(1.06) translateY(-1px); }
.dicon:hover{ background:rgba(160,215,255,.22); border-color:rgba(190,230,255,.45); }
.dicon.selected{ background:rgba(120,190,255,.38); border-color:rgba(190,230,255,.75); box-shadow:inset 0 0 8px rgba(255,255,255,.28); }
.dlabel{
  font-size:11.5px; color:#fff; text-align:center; max-width:82px; line-height:1.2;
  text-shadow:0 1px 3px rgba(0,20,60,.95), 0 0 8px rgba(0,30,80,.8); overflow-wrap:anywhere;
}

/* ---------- Ventanas Aero ---------- */
.aero-window{
  position:absolute; display:flex; flex-direction:column;
  border-radius:9px;
  background:linear-gradient(180deg, rgba(250,252,255,.58), rgba(228,240,252,.44) 120px, rgba(214,232,248,.38));
  backdrop-filter: blur(12px) saturate(1.55) brightness(1.06);
  -webkit-backdrop-filter: blur(12px) saturate(1.55) brightness(1.06);
  border:1px solid rgba(255,255,255,.52);
  box-shadow:0 8px 26px rgba(0,25,70,.32), inset 0 1px 0 rgba(255,255,255,.88);
  min-width:260px; min-height:160px;
}
.aero-window.active{
  border-color:rgba(150,210,255,.98);
  box-shadow:0 0 0 1px rgba(130,200,255,.5), 0 14px 40px rgba(0,25,70,.48), inset 0 1px 0 rgba(255,255,255,.98);
}
.aero-window.opening{ animation:winOpen .18s ease-out both; }
@keyframes winOpen{ from{ opacity:0; transform:scale(.88); } }
.aero-window.closing{ animation:winClose .15s ease-in both; pointer-events:none; }
@keyframes winClose{ to{ opacity:0; transform:scale(.92); } }
.aero-window.anim{ transition:left .2s ease, top .2s ease, width .2s ease, height .2s ease, transform .2s ease, opacity .2s ease; }
.aero-window.dragging{ transition:none; }
.aero-window.minimized{
  opacity:0; transform:translateY(90px) scale(.55); pointer-events:none;
  transition:transform .2s ease-in, opacity .2s ease-in;
}
.aero-window.maximized{ border-radius:0; }

.titlebar{
  height:34px; flex:0 0 34px; display:flex; align-items:center; gap:8px;
  padding:0 0 0 10px; touch-action:none; cursor:default;
  border-radius:9px 9px 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.68) 0%, rgba(255,255,255,.28) 46%, rgba(165,205,242,.22) 50%, rgba(125,172,222,.15) 100%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(120,160,210,.22);
}
.aero-window:not(.active) .titlebar{
  background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(235,240,246,.22) 50%, rgba(200,210,222,.14));
}
.win-title{ display:flex; align-items:center; gap:7px; min-width:0; flex:1; }
.win-title svg{ width:16px; height:16px; flex:0 0 auto; }
.win-title span{
  font-size:12.5px; font-weight:600; color:#0d2c55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 0 4px rgba(255,255,255,.9), 0 0 8px rgba(255,255,255,.7);
}
.aero-window:not(.active) .win-title span{ color:#41607e; }

.wbtn-group{
  display:flex; gap:1px; margin:0 7px 0 0; align-self:flex-start; margin-top:6px;
  border:1px solid rgba(255,255,255,.55); border-radius:9px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,30,70,.25);
}
.wbtn{
  width:29px; height:20px; border:none; cursor:pointer; display:grid; place-items:center;
  background:linear-gradient(180deg, rgba(235,246,255,.9), rgba(150,190,230,.75));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.wbtn svg{ width:10px; height:10px; }
.wbtn:hover{ background:linear-gradient(180deg, #eef8ff, #a8d2f2); }
.wbtn:active{ background:linear-gradient(180deg, #9cc4e6, #c4e0f6); }
.wbtn-close{ width:38px; background:linear-gradient(180deg, rgba(255,150,120,.95), rgba(216,70,45,.92)); }
.wbtn-close:hover{ background:linear-gradient(180deg, #ffab8c, #e5452a); box-shadow:0 0 8px rgba(255,90,50,.8); }
.wbtn-close:active{ background:linear-gradient(180deg, #d2482c, #ff9a78); }

.window-body{
  flex:1; min-height:0; margin:0 6px 6px;
  background:rgba(252,254,255,.92);
  border:1px solid rgba(255,255,255,.6); border-radius:5px;
  box-shadow:inset 0 1px 2px rgba(120,160,210,.25);
  overflow:hidden; display:flex; flex-direction:column;
}
.app-content{ height:100%; overflow:auto; padding:16px 18px; user-select:text; }
.app-content::-webkit-scrollbar{ width:11px; height:11px; }
.app-content::-webkit-scrollbar-track{ background:rgba(190,210,232,.35); border-radius:6px; }
.app-content::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,#cfe4f6,#a6c8e6); border-radius:6px; border:2px solid rgba(255,255,255,.5); }

.resizer{
  position:absolute; right:0; bottom:0; width:16px; height:16px; z-index:5;
  cursor:nwse-resize; touch-action:none;
  background:linear-gradient(135deg, transparent 0 50%, rgba(255,255,255,.7) 50% 60%, transparent 60% 70%, rgba(255,255,255,.7) 70% 80%, transparent 80%);
  border-bottom-right-radius:9px;
}
.aero-window.maximized .resizer{ display:none; }

/* ---------- Gadgets Vista (Margarita y Calendario) ---------- */
#sidebar-gadgets{
  display:none; /* oculto para coincidir exactamente con la captura de referencia */
  position:absolute; top:22px; right:24px; z-index:50;
  display:flex; flex-direction:column; align-items:center; gap:18px;
  pointer-events:auto; user-select:none;
}
.vista-gadget{
  filter:drop-shadow(0 6px 14px rgba(0,25,60,.35));
  transition:transform .18s ease; cursor:default;
}
.vista-gadget:hover{ transform:scale(1.05); }

.cal-card{
  width:108px; background:#ffffff; border-radius:6px; overflow:hidden;
  border:1px solid rgba(140,180,220,.85);
  box-shadow:0 4px 12px rgba(0,25,60,.25), inset 0 1px 0 #fff;
}
.cal-header{
  background:linear-gradient(180deg, #4ea3e8, #1860a4); color:#fff;
  font-size:9.5px; font-weight:700; text-align:center; padding:3.5px 2px;
  letter-spacing:.5px; text-shadow:0 1px 2px rgba(0,20,50,.6);
  border-bottom:1px solid #144e85;
}
.cal-days-head{
  display:grid; grid-template-columns:repeat(7, 1fr); text-align:center;
  background:#edf4fa; font-size:8px; font-weight:700; color:#36628c;
  padding:2px 2px; border-bottom:1px solid #d3e4f3;
}
.cal-days-body{
  display:grid; grid-template-columns:repeat(7, 1fr); text-align:center;
  padding:3px; gap:1px;
}
.cal-day{ font-size:8.5px; color:#223c58; padding:1.5px 0; border-radius:2px; }
.cal-day.empty{ visibility:hidden; }
.cal-day.today{
  background:linear-gradient(180deg, #ff9f43, #ee5253); color:#fff; font-weight:700;
  box-shadow:0 1px 3px rgba(230,60,40,.4);
}
@media (max-width: 850px){
  #sidebar-gadgets{ display:none; }
  display:none; /* oculto para coincidir exactamente con la captura de referencia */
}

/* ---------- Barra de Tareas y Quick Launch ---------- */
#taskbar{
  position:absolute; left:0; right:0; bottom:0; height:var(--taskbar-h); z-index:9500;
  display:flex; align-items:center; gap:6px; padding:0 8px 0 4px;
  background:linear-gradient(180deg, rgba(52,74,104,.62), rgba(10,24,48,.75));
  backdrop-filter: blur(16px) saturate(1.7);
  -webkit-backdrop-filter: blur(16px) saturate(1.7);
  border-top:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 -6px 18px rgba(0,15,45,.35);
}
#start-button{
  width:46px; height:40px; border:none; background:transparent; cursor:pointer;
  display:grid; place-items:center; border-radius:9px;
}
#start-button svg{ width:34px; height:34px; transition:filter .15s; }
#start-button:hover{ box-shadow:0 0 14px rgba(120,200,255,.55), inset 0 0 8px rgba(160,220,255,.3); }
#start-button:hover svg{ filter:brightness(1.2) drop-shadow(0 0 5px rgba(150,215,255,.9)); }

#quick-launch{
  display:flex; align-items:center; gap:2px; padding:0 6px 0 2px;
  border-right:1px solid rgba(255,255,255,.25); box-shadow:1px 0 0 rgba(0,10,30,.35);
  height:30px;
}
.ql-btn{
  width:26px; height:26px; display:grid; place-items:center;
  border:1px solid transparent; background:transparent; border-radius:4px;
  cursor:pointer; padding:0; transition:background .15s, border-color .15s;
}
.ql-btn svg{ width:18px; height:18px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.ql-btn:hover{ background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.35); }
.ql-btn:active{ background:rgba(180,220,255,.35); }

#task-buttons{ display:flex; gap:5px; flex:1; min-width:0; overflow:hidden; }
.task-btn{
  display:flex; align-items:center; gap:7px; height:32px; padding:0 11px; max-width:170px;
  border-radius:7px; cursor:pointer; border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08); color:#e8f3ff; font-size:12px;
}
.task-btn svg{ width:19px; height:19px; flex:0 0 auto; }
.task-btn .tb-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task-btn:hover{ background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.3); }
.task-btn.active{
  background:linear-gradient(180deg, rgba(190,225,255,.36), rgba(120,175,230,.22));
  border-color:rgba(190,225,255,.6);
  box-shadow:inset 0 1px 3px rgba(0,20,50,.35), inset 0 -1px 0 rgba(255,255,255,.28);
}
#tray{
  display:flex; align-items:center; gap:9px; padding:0 4px 0 10px; height:32px;
  border-left:1px solid rgba(255,255,255,.25); box-shadow:-1px 0 0 rgba(0,10,30,.35);
}
#tray svg{ width:17px; height:17px; opacity:.92; }
#clock{ text-align:right; color:#eaf6ff; font-size:11.5px; line-height:1.35; text-shadow:0 1px 2px rgba(0,10,30,.8); }

/* ---------- Menú Inicio ---------- */
#start-menu{
  position:absolute; left:6px; bottom:calc(var(--taskbar-h) + 5px); width:410px; z-index:9000;
  border-radius:10px; overflow:hidden; display:none;
  background:linear-gradient(180deg, rgba(250,253,255,.76), rgba(228,240,252,.64));
  backdrop-filter: blur(18px) saturate(1.6);
  -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 12px 42px rgba(0,20,60,.45), inset 0 1px 0 rgba(255,255,255,.9);
}
#start-menu.open{ display:block; animation:smIn .16s ease-out; }
@keyframes smIn{ from{ opacity:0; transform:translateY(14px); } }
.sm-cols{ display:grid; grid-template-columns:1.35fr .85fr; min-height:410px; }
.sm-left{
  background:rgba(255,255,255,.82); padding:8px; display:flex; flex-direction:column;
  border-right:1px solid rgba(160,195,230,.5);
}
.sm-item{
  display:flex; align-items:center; gap:10px; padding:6px 9px; border-radius:6px;
  border:1px solid transparent; cursor:pointer; font-size:12.5px; color:#16324f;
}
.sm-item svg{ width:28px; height:28px; flex:0 0 auto; }
.sm-item:hover{ background:linear-gradient(180deg,#e8f4ff,#d2e8fa); border-color:#b3d5f0; }
.sm-sep{ height:1px; background:linear-gradient(90deg, transparent, #c3d9ec, transparent); margin:6px 4px; }
.sm-search{
  margin-top:auto; display:flex; align-items:center; gap:6px;
  background:#fff; border:1px solid #a9c6e2; border-radius:999px; padding:5px 12px;
  box-shadow:inset 0 1px 3px rgba(30,70,120,.18);
}
.sm-search input{
  border:none; outline:none; flex:1; font-size:12px; font-family:inherit; color:#16324f; background:transparent;
}
.sm-search input::placeholder{ color:#8aa8c4; }
.sm-search svg{ width:14px; height:14px; opacity:.6; }
.sm-right{
  background:linear-gradient(180deg, rgba(88,128,168,.34), rgba(34,62,98,.5));
  padding:14px 12px; display:flex; flex-direction:column; color:#eaf4ff;
}
.sm-user{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.sm-user svg{ width:44px; height:44px; filter:drop-shadow(0 2px 4px rgba(0,20,50,.4)); }
.sm-user b{ font-size:13px; display:block; text-shadow:0 1px 2px rgba(0,20,50,.6); }
.sm-user small{ font-size:10.5px; opacity:.85; }
.sm-link{
  display:block; padding:5px 9px; margin-left:-6px; border-radius:6px; font-size:12px;
  color:#e8f3ff; text-decoration:none; cursor:pointer; text-shadow:0 1px 2px rgba(0,20,50,.5);
}
.sm-link:hover{ background:rgba(255,255,255,.16); text-decoration:underline; }
.sm-shutdown{
  margin-top:auto; align-self:flex-end; display:flex; align-items:center; gap:8px;
  padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.5); cursor:pointer;
  background:linear-gradient(180deg, rgba(255,150,110,.95), rgba(205,70,35,.95)); color:#fff; font-size:12.5px; font-weight:600;
  box-shadow:0 2px 8px rgba(120,30,0,.4), inset 0 1px 0 rgba(255,255,255,.6);
}
.sm-shutdown:hover{ filter:brightness(1.12); box-shadow:0 0 12px rgba(255,110,60,.7); }
.sm-shutdown svg{ width:18px; height:18px; }

/* ---------- Pantalla de apagado ---------- */
#shutdown-screen{
  position:fixed; inset:0; z-index:99999; background:#000; display:none;
  place-items:center; text-align:center; cursor:pointer;
}
#shutdown-screen.show{ display:grid; animation:fadeBlack .8s ease-out; }
@keyframes fadeBlack{ from{ opacity:0; } }
#shutdown-screen h2{ color:#f5b544; font-weight:400; font-size:26px; margin-bottom:10px; }
#shutdown-screen p{ color:#9aa7b5; font-size:13px; }

/* ============================================================
   ESTILOS ESPECÍFICOS DE CADA APLICACIÓN
   ============================================================ */

/* 1. Projects */
.addr-bar{
  display:flex; align-items:center; gap:8px; font-size:12px; color:#3a6da0;
  background:linear-gradient(180deg,#f2f9ff,#e2effb);
  border:1px solid #c3ddf1; border-radius:5px; padding:6px 10px; margin-bottom:12px;
}
.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
.proj-card{
  background:linear-gradient(180deg,#ffffff,#f0f7fd); border:1px solid #bcd6ec; border-radius:8px;
  padding:12px; display:flex; flex-direction:column; gap:8px;
  box-shadow:0 2px 6px rgba(20,60,110,.12), inset 0 1px 0 #fff;
}
.proj-head{ display:flex; align-items:center; gap:8px; }
.proj-head h3{ font-size:13.5px; color:#0d2c55; }
.proj-card p{ font-size:12px; line-height:1.5; color:#3d5a75; flex:1; }
.tags{ display:flex; flex-wrap:wrap; gap:5px; }
.tags span{ font-size:10.5px; padding:2px 8px; border-radius:999px; background:#dcebf8; border:1px solid #b7d5ec; color:#2c587e; }
.proj-link{
  font-size:11.5px; font-weight:600; text-decoration:none; color:#11477e;
  padding:4px 11px; border-radius:5px; width:max-content;
  background:linear-gradient(180deg,#f4faff,#d8ecfc); border:1px solid #9cc4e4;
}
.proj-link:hover{ background:linear-gradient(180deg,#ffffff,#e8f5ff); box-shadow:0 1px 4px rgba(40,120,200,.3); }
.proj-soon{ color:#7a94ab; background:#eef3f8; border-color:#cfdae5; cursor:default; }

/* 2. About Me */
.about-head{ display:flex; gap:16px; align-items:center; margin-bottom:14px; }
.about-avatar svg{ width:76px; height:76px; filter:drop-shadow(0 3px 6px rgba(0,30,80,.3)); }
.about-head h1{ font-size:22px; color:#0d2c55; }
.about-title{ font-size:13px; color:#3a6da0; margin-top:2px; font-weight:500; }
.about-bio{ font-size:13px; line-height:1.6; color:#2a4664; margin-bottom:14px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.chip{
  font-size:11.5px; padding:4px 11px; border-radius:999px; color:#11477e;
  background:linear-gradient(180deg,#eaf6ff,#cfe6fa); border:1px solid #a9cdec;
  box-shadow:inset 0 1px 0 #fff;
}
.about-actions{ display:flex; gap:10px; }
.about-btn{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:6px;
  background:linear-gradient(180deg,#f7fbff,#d8ebfa); border:1px solid #9fc5e6;
  color:#10477e; font-size:12px; font-weight:600; text-decoration:none; cursor:pointer;
}
.about-btn:hover{ background:linear-gradient(180deg,#ffffff,#e5f2fd); box-shadow:0 2px 6px rgba(30,100,180,.25); }

/* 3. Internet Explorer */
.ie-container{ display:flex; flex-direction:column; height:100%; }
.ie-nav{
  display:flex; align-items:center; gap:6px; padding:6px 8px;
  background:linear-gradient(180deg,#e8f1fa,#d0e2f2); border-bottom:1px solid #b2cee6;
}
.ie-circle-btn{
  width:26px; height:26px; border-radius:50%; border:1px solid #8eb5d6;
  background:linear-gradient(180deg,#ffffff,#cde2f5); display:grid; place-items:center;
  cursor:pointer; color:#285e92; font-size:12px; font-weight:bold;
}
.ie-circle-btn:hover{ background:linear-gradient(180deg,#ffffff,#e1effb); box-shadow:0 0 6px rgba(60,140,220,.5); }
.ie-addr-wrap{
  flex:1; display:flex; align-items:center; background:#fff; border:1px solid #9abddb;
  border-radius:4px; padding:2px 8px; gap:6px; box-shadow:inset 0 1px 2px rgba(0,20,60,.1);
}
.ie-addr-wrap svg{ width:14px; height:14px; opacity:.7; }
.ie-addr-input{ flex:1; border:none; outline:none; font-size:12px; color:#183654; }
.ie-go-btn{
  background:linear-gradient(180deg,#a2d96c,#68b82e); border:1px solid #4d8f1e;
  border-radius:3px; color:#fff; font-size:11px; font-weight:700; padding:2px 8px; cursor:pointer;
}
.ie-tabs{
  display:flex; gap:2px; padding:4px 8px 0; background:linear-gradient(180deg,#cadff3,#b4d0eb);

   GESTOR DE VENTANAS
   ============================================================ */
const desktop = document.getElementById('desktop');
const taskButtons = document.getElementById('task-buttons');
const openWins = new Map();
let zTop = 100;
let cascade = 0;
const coarse = matchMedia('(pointer: coarse)').matches;
const TASKBAR = 44;

function deskSize(){
  return { w: desktop.clientWidth, h: desktop.clientHeight };
}

function focusWin(win){
  if (win.minimized){ win.minimized = false; win.el.classList.remove('minimized'); }
  win.el.style.zIndex = ++zTop;
  openWins.forEach(w => w.el.classList.toggle('active', w === win));
  updateTaskButtons();
}

function openApp(appId, origin){
  if (openWins.has(appId)){ focusWin(openWins.get(appId)); return; }
  const app = APPS[appId];
  if (!app) return;

  const d = deskSize();
  const el = document.createElement('section');
  el.className = 'aero-window opening';
  el.innerHTML = `
    <header class="titlebar">
      <div class="win-title">${svgIcon(app.icono, 16)}<span>${esc(app.titulo)}</span></div>
      <div class="wbtn-group">
        <button class="wbtn" data-act="min" title="Minimizar" aria-label="Minimizar">${GLYPHS.min}</button>
        <button class="wbtn" data-act="max" title="Maximizar" aria-label="Maximizar">${GLYPHS.max}</button>
        <button class="wbtn wbtn-close" data-act="close" title="Cerrar" aria-label="Cerrar">${GLYPHS.close}</button>
      </div>
    </header>
    <div class="window-body">${app.render()}</div>
    <div class="resizer" title="Redimensionar"></div>`;

  let w = Math.min(app.w, d.w - 16);
  let h = Math.min(app.h, d.h - TASKBAR - 14);
  let x, y;
  if (d.w < 700){ x = 4; y = 4; }
  else if (openWins.size === 0){ x = Math.round((d.w - w) / 2); y = Math.round((d.h - TASKBAR - h) / 2) - 14; }
  else { const off = (cascade++ % 6) * 28; x = 60 + off; y = 35 + off; }
  x = clamp(x, 4, Math.max(4, d.w - w - 6));
  y = clamp(y, 4, Math.max(4, d.h - TASKBAR - h - 6));

  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });

  if (origin){
    const r = el.getBoundingClientRect();
    el.style.transformOrigin = `${origin.x - r.left}px ${origin.y - r.top}px`;
  }
  desktop.appendChild(el);
  setTimeout(() => el.classList.remove('opening'), 220);

  const win = { appId, el, minimized: false, maximized: false, prev: null, taskBtn: null };
  openWins.set(appId, win);

  el.addEventListener('pointerdown', () => focusWin(win));
  el.addEventListener('click', e => {
    const btn = e.target.closest('.wbtn');
    if (!btn) return;
    if (btn.dataset.act === 'min') minimizeWin(win);
    else if (btn.dataset.act === 'max') toggleMax(win);
    else closeWin(win);
  });

  const tb = el.querySelector('.titlebar');
  tb.addEventListener('dblclick', e => { if (!e.target.closest('.wbtn-group')) toggleMax(win); });
  tb.addEventListener('pointerdown', e => startDrag(e, win, tb));
  el.querySelector('.resizer').addEventListener('pointerdown', e => startResize(e, win));

  addTaskButton(win);
  focusWin(win);

  // Inicialización de lógica interna de cada app
  initAppLogic(appId, el);

  return win;
}

function startDrag(e, win, tb){
  if (e.button !== 0 || e.target.closest('.wbtn-group')) return;
  if (win.maximized) return;
  const dr = desktop.getBoundingClientRect();
  const r = win.el.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  win.el.classList.add('dragging');
  tb.setPointerCapture(e.pointerId);
  const onMove = ev => {
    let x = ev.clientX - dr.left - ox;
    let y = ev.clientY - dr.top - oy;
    x = clamp(x, 110 - r.width, dr.width - 90);
    y = clamp(y, 0, dr.height - TASKBAR - 30);
    win.el.style.left = Math.round(x) + 'px';
    win.el.style.top = Math.round(y) + 'px';
  };
  const stop = () => {
    win.el.classList.remove('dragging');
    tb.removeEventListener('pointermove', onMove);
    tb.removeEventListener('pointerup', stop);
    tb.removeEventListener('pointercancel', stop);
  };
  tb.addEventListener('pointermove', onMove);
  tb.addEventListener('pointerup', stop);
  tb.addEventListener('pointercancel', stop);
}

function startResize(e, win){
  if (e.button !== 0) return;
  e.preventDefault();
  const app = APPS[win.appId];
  const handle = e.currentTarget;
  const r = win.el.getBoundingClientRect();
  const d = deskSize();
  win.el.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
  const onMove = ev => {
    const w = clamp(ev.clientX - r.left, app.minW || 340, d.w - r.left - 2);
    const h = clamp(ev.clientY - r.top, app.minH || 240, d.h - TASKBAR - r.top - 2);
    win.el.style.width = Math.round(w) + 'px';
    win.el.style.height = Math.round(h) + 'px';
  };
  const stop = () => {
    win.el.classList.remove('dragging');
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', stop);
    handle.removeEventListener('pointercancel', stop);
  };
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

function toggleMax(win){
  const d = deskSize();
  const el = win.el;
  el.classList.add('anim');
  if (!win.maximized){
    win.prev = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    Object.assign(el.style, { left: '0px', top: '0px', width: d.w + 'px', height: (d.h - TASKBAR) + 'px' });
    win.maximized = true;
    el.classList.add('maximized');
    el.querySelector('[data-act="max"]').innerHTML = GLYPHS.restore;
  } else {
    const p = win.prev || { x: 60, y: 40, w: 580, h: 420 };
    Object.assign(el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' });
    win.maximized = false;
    el.classList.remove('maximized');
    el.querySelector('[data-act="max"]').innerHTML = GLYPHS.max;
  }
  setTimeout(() => el.classList.remove('anim'), 230);
}

function minimizeWin(win){
  win.minimized = true;
  win.el.style.transformOrigin = '50% 100%';
  win.el.classList.add('minimized');
  updateTaskButtons();
}

function closeWin(win){
  win.el.classList.add('closing');
  if (win.taskBtn) win.taskBtn.remove();
  openWins.delete(win.appId);
  setTimeout(() => {
    win.el.remove();
    let top = null;
    openWins.forEach(w => { if (!w.minimized && (!top || +w.el.style.zIndex > +top.el.style.zIndex)) top = w; });
    if (top) focusWin(top); else updateTaskButtons();
  }, 160);
}

function updateClockGadget(){

/* Gadget: Calendario */
function renderCalendarGadget(){
  const now = new Date();
  const months = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const monthYearEl = document.getElementById('cal-month-year');
  if (monthYearEl) {
    monthYearEl.textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  const gridEl = document.getElementById('cal-grid');
  if (!gridEl) return;
  const year = now.getFullYear();
  const month = now.getMonth();
  const today = now.getDate();
  const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
  const totalDays = new Date(year, month + 1, 0).getDate();
  
  let html = '<div class="cal-days-head"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="cal-days-body">';
  for (let i = 0; i < firstDay; i++) html += '<span class="cal-day empty"></span>';
  for (let d = 1; d <= totalDays; d++) {
    const isToday = d === today ? ' class="cal-day today"' : ' class="cal-day"';
    html += `<span${isToday}>${d}</span>`;
  }
  html += '</div>';
  gridEl.innerHTML = html;
}

/* Síntesis suave de acorde ambiental Frutiger Aero */
function playAmbientSound(){
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const freqs = [261.63, 329.63, 392.00, 523.25]; // Do Mayor 7 / Acorde etéreo
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now);
    
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.04, now + 1.2);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.15);
    osc.stop(now + 6.5);
  });
}
