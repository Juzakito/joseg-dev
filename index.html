<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portafolio interactivo estilo escritorio Windows Vista (Frutiger Aero).">
<title>Jose G. — Escritorio</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='a' cx='.35' cy='.3' r='1'><stop offset='0' stop-color='%23d9f2ff'/><stop offset='.5' stop-color='%2350a8e6'/><stop offset='1' stop-color='%230f5aa0'/></radialGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23a)'/><ellipse cx='24' cy='15' rx='17' ry='9' fill='%23fff' fill-opacity='.55'/></svg>">
<style>
/* ============================================================
   ESCRITORIO AERO — estilos
   Secciones: base, fondo, iconos, ventanas, apps, barra de
   tareas, menú inicio, apagado, responsive
   ============================================================ */
:root{
  --taskbar-h: 44px;
  --glass-border: rgba(255,255,255,.65);
  --azul: #1e5fa8;
  --texto: #16324f;
}
*{ box-sizing: border-box; margin:0; padding:0; }
html, body{ height:100%; overflow:hidden; }
body{
  font-family: "Segoe UI", "Segoe UI Web", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--texto);
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; }
a{ color: var(--azul); }

/* ---------- fondo ---------- */
#desktop{ position:fixed; inset:0; overflow:hidden; user-select:none; }
#wallpaper{ position:absolute; inset:0; width:100%; height:100%; z-index:0; }
.watermark{
  position:absolute; right:16px; bottom:calc(var(--taskbar-h) + 12px); z-index:1;
  text-align:right; color:#eaf6ff; opacity:.8; font-size:11px; line-height:1.5;
  text-shadow:0 1px 3px rgba(0,20,60,.9);
  pointer-events:none;
}

/* ---------- iconos del escritorio ---------- */
#icon-col{
  position:absolute; top:12px; left:10px; z-index:1;
  display:flex; flex-direction:column; flex-wrap:wrap; align-content:flex-start;
  gap:6px; height:calc(100% - var(--taskbar-h) - 30px);
}
.dicon{
  width:86px; padding:7px 4px 5px; border-radius:7px; border:1px solid transparent;
  display:flex; flex-direction:column; align-items:center; gap:5px; cursor:default;
}
.dicon svg{ width:48px; height:48px; filter:drop-shadow(0 3px 4px rgba(0,20,60,.45)); transition:transform .12s; }
.dicon:hover svg{ transform:scale(1.07) translateY(-1px); }
.dicon:hover{ background:rgba(160,215,255,.18); border-color:rgba(190,230,255,.35); }
.dicon.selected{ background:rgba(120,190,255,.35); border-color:rgba(190,230,255,.65); box-shadow:inset 0 0 8px rgba(255,255,255,.25); }
.dlabel{
  font-size:12px; color:#fff; text-align:center; max-width:84px; line-height:1.25;
  text-shadow:0 1px 3px rgba(0,20,60,.95), 0 0 7px rgba(0,30,80,.7); overflow-wrap:anywhere;
}

/* ---------- ventanas ---------- */
.aero-window{
  position:absolute; display:flex; flex-direction:column;
  border-radius:9px;
  background:linear-gradient(180deg, rgba(250,252,255,.52), rgba(228,240,252,.40) 120px, rgba(214,232,248,.36));
  backdrop-filter: blur(10px) saturate(1.5) brightness(1.05);
  -webkit-backdrop-filter: blur(10px) saturate(1.5) brightness(1.05);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 6px 22px rgba(0,25,70,.30), inset 0 1px 0 rgba(255,255,255,.85);
  min-width:200px; min-height:120px;
}
.aero-window.active{
  border-color:rgba(150,205,255,.95);
  box-shadow:0 0 0 1px rgba(120,190,255,.45), 0 12px 36px rgba(0,25,70,.45), inset 0 1px 0 rgba(255,255,255,.95);
}
.aero-window.opening{ animation:winOpen .18s ease-out both; }
@keyframes winOpen{ from{ opacity:0; transform:scale(.86); } }
.aero-window.closing{ animation:winClose .15s ease-in both; pointer-events:none; }
@keyframes winClose{ to{ opacity:0; transform:scale(.9); } }
.aero-window.anim{ transition:left .2s ease, top .2s ease, width .2s ease, height .2s ease, transform .2s ease, opacity .2s ease; }
.aero-window.dragging{ transition:none; }
.aero-window.minimized{
  opacity:0; transform:translateY(90px) scale(.55); pointer-events:none;
  transition:transform .2s ease-in, opacity .2s ease-in;
}
.aero-window.maximized{ border-radius:0; }

.titlebar{
  height:34px; flex:0 0 34px; display:flex; align-items:center; gap:8px;
  padding:0 0 0 10px; touch-action:none; cursor:default;
  border-radius:9px 9px 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.26) 46%, rgba(165,205,242,.20) 50%, rgba(125,172,222,.12) 100%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(120,160,210,.22);
}
.aero-window:not(.active) .titlebar{
  background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(235,240,246,.22) 50%, rgba(200,210,222,.14));
}
.win-title{ display:flex; align-items:center; gap:7px; min-width:0; flex:1; }
.win-title svg{ width:16px; height:16px; flex:0 0 auto; }
.win-title span{
  font-size:12.5px; font-weight:600; color:#0d2c55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 0 4px rgba(255,255,255,.9), 0 0 8px rgba(255,255,255,.7);
}
.aero-window:not(.active) .win-title span{ color:#41607e; }

.wbtn-group{
  display:flex; gap:1px; margin:0 7px 0 0; align-self:flex-start; margin-top:6px;
  border:1px solid rgba(255,255,255,.55); border-radius:9px; overflow:hidden;
  box-shadow:0 1px 3px rgba(0,30,70,.25);
}
.wbtn{
  width:29px; height:20px; border:none; cursor:pointer; display:grid; place-items:center;
  background:linear-gradient(180deg, rgba(235,246,255,.9), rgba(150,190,230,.75));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.wbtn svg{ width:10px; height:10px; }
.wbtn:hover{ background:linear-gradient(180deg, #eef8ff, #a8d2f2); }
.wbtn:active{ background:linear-gradient(180deg, #9cc4e6, #c4e0f6); }
.wbtn-close{ width:38px; background:linear-gradient(180deg, rgba(255,150,120,.95), rgba(216,70,45,.92)); }
.wbtn-close:hover{ background:linear-gradient(180deg, #ffab8c, #e5452a); box-shadow:0 0 8px rgba(255,90,50,.8); }
.wbtn-close:active{ background:linear-gradient(180deg, #d2482c, #ff9a78); }

.window-body{
  flex:1; min-height:0; margin:0 6px 6px;
  background:rgba(252,254,255,.88);
  border:1px solid rgba(255,255,255,.6); border-radius:5px;
  box-shadow:inset 0 1px 2px rgba(120,160,210,.25);
  overflow:hidden;
}
.app-content{ height:100%; overflow:auto; padding:16px 18px; user-select:text; }
.app-content::-webkit-scrollbar{ width:11px; height:11px; }
.app-content::-webkit-scrollbar-track{ background:rgba(190,210,232,.35); border-radius:6px; }
.app-content::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,#cfe4f6,#a6c8e6); border-radius:6px; border:2px solid rgba(255,255,255,.5); }

.resizer{
  position:absolute; right:0; bottom:0; width:16px; height:16px; z-index:5;
  cursor:nwse-resize; touch-action:none;
  background:linear-gradient(135deg, transparent 0 50%, rgba(255,255,255,.7) 50% 60%, transparent 60% 70%, rgba(255,255,255,.7) 70% 80%, transparent 80%);
  border-bottom-right-radius:9px;
}
.aero-window.maximized .resizer{ display:none; }

/* ---------- app: sobre mí ---------- */
.about-head{ display:flex; gap:18px; align-items:center; margin-bottom:14px; }
.about-avatar svg{ width:84px; height:84px; filter:drop-shadow(0 3px 6px rgba(0,30,80,.35)); }
.about-head h1{ font-size:24px; color:#0d2c55; }
.about-title{ font-size:13.5px; color:#3a6da0; margin-top:2px; }
.about-bio{ font-size:13.5px; line-height:1.6; color:#2a4664; margin-bottom:14px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  font-size:11.5px; padding:4px 11px; border-radius:999px; color:#11477e;
  background:linear-gradient(180deg,#eaf6ff,#cfe6fa); border:1px solid #a9cdec;
  box-shadow:inset 0 1px 0 #fff;
}

/* ---------- app: proyectos ---------- */
.addr{
  font-size:12px; color:#3a6da0; background:linear-gradient(180deg,#f2f9ff,#e2effb);
  border:1px solid #c3ddf1; border-radius:5px; padding:5px 10px; margin-bottom:12px;
}
.proj-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px; }
.proj-card{
  background:linear-gradient(180deg,#ffffff,#f0f7fd); border:1px solid #bcd6ec; border-radius:8px;
  padding:12px; display:flex; flex-direction:column; gap:8px;
  box-shadow:0 2px 6px rgba(20,60,110,.12), inset 0 1px 0 #fff;
}
.proj-head{ display:flex; align-items:center; gap:8px; }
.proj-head h3{ font-size:14px; color:#0d2c55; }
.proj-card p{ font-size:12.5px; line-height:1.5; color:#3d5a75; flex:1; }
.tags{ display:flex; flex-wrap:wrap; gap:5px; }
.tags span{ font-size:10.5px; padding:2px 8px; border-radius:999px; background:#dcebf8; border:1px solid #b7d5ec; color:#2c587e; }
.proj-link{
  font-size:12px; font-weight:600; text-decoration:none; color:#11477e;
  padding:4px 10px; border-radius:5px; width:max-content;
  background:linear-gradient(180deg,#f4faff,#d8ecfc); border:1px solid #9cc4e4;
}
.proj-link:hover{ background:linear-gradient(180deg,#ffffff,#e8f5ff); box-shadow:0 1px 4px rgba(40,120,200,.3); }
.proj-soon{ color:#7a94ab; background:#eef3f8; border-color:#cfdae5; cursor:default; }

/* ---------- app: índice de experiencia ---------- */
.wei-head{ display:flex; gap:16px; align-items:center; margin-bottom:16px; }
.wei-base{
  background:linear-gradient(180deg,#2a72b8,#154f8c); color:#fff; border-radius:8px;
  padding:10px 14px; text-align:center; box-shadow:0 2px 8px rgba(20,60,110,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.wei-num{ display:block; font-size:26px; font-weight:700; }
.wei-base small{ font-size:10.5px; opacity:.9; }
.wei-head p{ font-size:11.5px; color:#5a7d98; line-height:1.5; max-width:280px; }
.wei-row{ display:grid; grid-template-columns:130px 1fr 40px; gap:10px; align-items:center; margin-bottom:10px; }
.wei-name{ font-size:12.5px; color:#2a4664; }
.bar-wrap{ height:11px; border-radius:6px; background:rgba(120,150,190,.25); box-shadow:inset 0 1px 3px rgba(0,30,60,.25); overflow:hidden; }
.bar-fill{
  height:100%; width:0; border-radius:6px;
  background:linear-gradient(90deg,#37c26e,#31a4e0);
  box-shadow:inset 0 -2px 3px rgba(0,60,20,.25), inset 0 1px 0 rgba(255,255,255,.55);
  transition:width .8s cubic-bezier(.25,.8,.35,1);
}
.wei-score{
  font-size:12px; font-weight:700; color:#fff; text-align:center;
  background:linear-gradient(180deg,#3d84c8,#1e5fa8); border-radius:4px; padding:2px 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}

/* ---------- app: contacto ---------- */
.contact h2{ font-size:20px; color:#0d2c55; margin-bottom:6px; }
.contact > p{ font-size:13px; color:#3d5a75; margin-bottom:16px; }
.big-btn{
  display:flex; align-items:center; gap:12px; text-decoration:none; margin-bottom:10px;
  padding:10px 16px; border-radius:10px;
  background:linear-gradient(180deg,#f6fbff,#d5e9f9); border:1px solid #9cc4e4;
  box-shadow:0 2px 8px rgba(20,60,110,.15), inset 0 1px 0 #fff;
  transition:box-shadow .15s, transform .15s;
}
.big-btn:hover{ box-shadow:0 4px 14px rgba(40,120,200,.35); transform:translateY(-1px); }
.big-btn b{ color:#0d2c55; font-size:14px; }
.big-btn small{ color:#3a6da0; font-size:11.5px; }
.big-btn svg{ filter:drop-shadow(0 2px 3px rgba(0,30,80,.25)); }

/* ---------- app: bloc de notas ---------- */
.np-menubar{
  display:flex; gap:2px; padding:2px 6px; margin:-16px -18px 10px;
  background:linear-gradient(180deg,#f8fbff,#e8f1fa); border-bottom:1px solid #cbdef0;
  position:sticky; top:-16px; z-index:2;
}
.np-menubar span{ font-size:12px; color:#2a4664; padding:2px 8px; border-radius:3px; }
.np-menubar span:hover{ background:#d8ebfb; }
.np{ font-family:Consolas,"Courier New",monospace; font-size:12.5px; line-height:1.55; color:#22384e; white-space:pre-wrap; }
.np b{ color:#0d4c8c; }

/* ---------- barra de tareas ---------- */
#taskbar{
  position:absolute; left:0; right:0; bottom:0; height:var(--taskbar-h); z-index:9500;
  display:flex; align-items:center; gap:6px; padding:0 8px 0 4px;
  background:linear-gradient(180deg, rgba(52,74,104,.60), rgba(10,24,48,.72));
  backdrop-filter: blur(16px) saturate(1.7);
  -webkit-backdrop-filter: blur(16px) saturate(1.7);
  border-top:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 -6px 18px rgba(0,15,45,.35);
}
#start-button{
  width:46px; height:40px; border:none; background:transparent; cursor:pointer;
  display:grid; place-items:center; border-radius:9px;
}
#start-button svg{ width:34px; height:34px; transition:filter .15s; }
#start-button:hover{ box-shadow:0 0 14px rgba(120,200,255,.55), inset 0 0 8px rgba(160,220,255,.3); }
#start-button:hover svg{ filter:brightness(1.2) drop-shadow(0 0 5px rgba(150,215,255,.9)); }
#task-buttons{ display:flex; gap:5px; flex:1; min-width:0; overflow:hidden; }
.task-btn{
  display:flex; align-items:center; gap:7px; height:32px; padding:0 11px; max-width:170px;
  border-radius:7px; cursor:pointer; border:1px solid transparent;
  background:rgba(255,255,255,.07); color:#e8f3ff; font-size:12px;
}
.task-btn svg{ width:19px; height:19px; flex:0 0 auto; }
.task-btn .tb-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task-btn:hover{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.25); }
.task-btn.active{
  background:linear-gradient(180deg, rgba(190,225,255,.32), rgba(120,175,230,.18));
  border-color:rgba(190,225,255,.55);
  box-shadow:inset 0 1px 3px rgba(0,20,50,.35), inset 0 -1px 0 rgba(255,255,255,.25);
}
#tray{
  display:flex; align-items:center; gap:9px; padding:0 4px 0 10px; height:32px;
  border-left:1px solid rgba(255,255,255,.25); box-shadow:-1px 0 0 rgba(0,10,30,.35);
}
#tray svg{ width:17px; height:17px; opacity:.92; }
#clock{ text-align:right; color:#eaf6ff; font-size:11.5px; line-height:1.35; text-shadow:0 1px 2px rgba(0,10,30,.8); }

/* ---------- menú inicio ---------- */
#start-menu{
  position:absolute; left:6px; bottom:calc(var(--taskbar-h) + 5px); width:402px; z-index:9000;
  border-radius:10px; overflow:hidden; display:none;
  background:linear-gradient(180deg, rgba(250,253,255,.74), rgba(228,240,252,.62));
  backdrop-filter: blur(18px) saturate(1.6);
  -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 12px 42px rgba(0,20,60,.45), inset 0 1px 0 rgba(255,255,255,.9);
}
#start-menu.open{ display:block; animation:smIn .16s ease-out; }
@keyframes smIn{ from{ opacity:0; transform:translateY(14px); } }
.sm-cols{ display:grid; grid-template-columns:1.25fr .9fr; min-height:392px; }
.sm-left{
  background:rgba(255,255,255,.78); padding:8px; display:flex; flex-direction:column;
  border-right:1px solid rgba(160,195,230,.5);
}
.sm-item{
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px;
  border:1px solid transparent; cursor:pointer; font-size:13px; color:#16324f;
}
.sm-item svg{ width:30px; height:30px; flex:0 0 auto; }
.sm-item:hover{ background:linear-gradient(180deg,#e8f4ff,#d2e8fa); border-color:#b3d5f0; }
.sm-sep{ height:1px; background:linear-gradient(90deg, transparent, #c3d9ec, transparent); margin:7px 4px; }
.sm-allprograms{ font-size:12.5px; font-weight:600; }
.sm-search{
  margin-top:auto; display:flex; align-items:center; gap:6px;
  background:#fff; border:1px solid #a9c6e2; border-radius:999px; padding:5px 12px;
  box-shadow:inset 0 1px 3px rgba(30,70,120,.18);
}
.sm-search input{
  border:none; outline:none; flex:1; font-size:12.5px; font-family:inherit; color:#16324f; background:transparent;
}
.sm-search input::placeholder{ color:#8aa8c4; }
.sm-search svg{ width:14px; height:14px; opacity:.6; }
.sm-right{
  background:linear-gradient(180deg, rgba(88,128,168,.34), rgba(34,62,98,.5));
  padding:14px 12px; display:flex; flex-direction:column; color:#eaf4ff;
}
.sm-user{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.sm-user svg{ width:46px; height:46px; filter:drop-shadow(0 2px 4px rgba(0,20,50,.4)); }
.sm-user b{ font-size:13.5px; display:block; text-shadow:0 1px 2px rgba(0,20,50,.6); }
.sm-user small{ font-size:11px; opacity:.85; }
.sm-link{
  display:block; padding:6px 10px; margin-left:-10px; border-radius:6px; font-size:12.5px;
  color:#e8f3ff; text-decoration:none; cursor:pointer; text-shadow:0 1px 2px rgba(0,20,50,.5);
}
.sm-link:hover{ background:rgba(255,255,255,.16); text-decoration:underline; }
.sm-shutdown{
  margin-top:auto; align-self:flex-end; display:flex; align-items:center; gap:8px;
  padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.5); cursor:pointer;
  background:linear-gradient(180deg, rgba(255,150,110,.95), rgba(205,70,35,.95)); color:#fff; font-size:12.5px; font-weight:600;
  box-shadow:0 2px 8px rgba(120,30,0,.4), inset 0 1px 0 rgba(255,255,255,.6);
}
.sm-shutdown:hover{ filter:brightness(1.12); box-shadow:0 0 12px rgba(255,110,60,.7); }
.sm-shutdown svg{ width:18px; height:18px; }

/* ---------- apagado ---------- */
#shutdown-screen{
  position:fixed; inset:0; z-index:99999; background:#000; display:none;
  place-items:center; text-align:center; cursor:pointer;
}
#shutdown-screen.show{ display:grid; animation:fadeBlack .8s ease-out; }
@keyframes fadeBlack{ from{ opacity:0; } }
#shutdown-screen h2{ color:#f5b544; font-weight:400; font-size:26px; margin-bottom:10px; }
#shutdown-screen p{ color:#9aa7b5; font-size:13px; }

/* ---------- responsive ---------- */
@media (max-width: 700px){
  .dicon{ width:72px; }
  .dicon svg{ width:42px; height:42px; }
  #start-menu{ width:min(92vw, 340px); }
  .sm-cols{ min-height:340px; grid-template-columns:1fr .8fr; }
  .task-btn{ padding:0 8px; max-width:110px; }
  .wei-row{ grid-template-columns:100px 1fr 38px; }
  .about-head h1{ font-size:20px; }
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .aero-window, #start-menu{ background-color:rgba(238,246,255,.95); }
  #taskbar{ background-color:rgba(18,34,60,.97); }
}
</style>
</head>
<body>

<div id="desktop">

  <!-- Fondo estilo aurora de Vista, dibujado con SVG (sin imágenes externas) -->
  <svg id="wallpaper" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="w-cielo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#06244e"/>
        <stop offset="0.42" stop-color="#0d4784"/>
        <stop offset="0.66" stop-color="#1877b6"/>
        <stop offset="0.85" stop-color="#28a091"/>
        <stop offset="1" stop-color="#3fbf9a"/>
      </linearGradient>
      <radialGradient id="w-glow" cx="0.5" cy="0.52" r="0.55">
        <stop offset="0" stop-color="#bfffe8" stop-opacity="0.5"/>
        <stop offset="0.5" stop-color="#5fd8c0" stop-opacity="0.22"/>
        <stop offset="1" stop-color="#5fd8c0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="w-cinta" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#63e6b0" stop-opacity="0"/>
        <stop offset="0.25" stop-color="#7df0bd"/>
        <stop offset="0.55" stop-color="#4fc8f0"/>
        <stop offset="0.85" stop-color="#6fd8ff" stop-opacity="0.4"/>
        <stop offset="1" stop-color="#6fd8ff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="w-cinta2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4fa8e8" stop-opacity="0"/>
        <stop offset="0.4" stop-color="#7fd4ff" stop-opacity="0.8"/>
        <stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
      </linearGradient>

  return `

}
function renderProjects(){
  return `
    <div class="addr">Escritorio ▸ Proyectos (${DATA.projects.length})</div>
    <div class="proj-grid">
      ${DATA.projects.map(p => `
        <article class="proj-card">

          <div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>

function renderSkills(){
  const base = Math.min(...DATA.skills.map(s => s.score));
  return `
    <div class="wei-head">
      <div class="wei-base"><span class="wei-num">${base.toFixed(1).replace('.', ',')}</span><small>Índice base</small></div>
      <p>Puntuación de 1,0 a 5,9 — como el índice de experiencia de Windows Vista. Edita tus niveles en los DATOS EDITABLES.</p>

    ${DATA.skills.map(s => `
      <div class="wei-row">

        <div class="bar-wrap"><div class="bar-fill" data-w="${(s.score / 5.9 * 100).toFixed(1)}"></div></div>

}

    <a class="big-btn" href="${esc(g.linkedin)}" target="_blank" rel="noopener">${svgIcon('linkedin', 38)}<span><b>LinkedIn</b><br><small>${esc(g.linkedin.replace('https://', ''))}</small></span></a>
    <a class="big-btn" href="mailto:${esc(g.email)}">${svgIcon('mail', 38)}<span><b>Correo</b><br><small>${esc(g.email)}</small></span></a>`;
}
function renderReadme(){
  return `
    <div class="np-menubar"><span>Archivo</span><span>Edición</span><span>Formato</span><span>Ver</span><span>Ayuda</span></div>
    <div class="np"><b>LÉEME.txt — cómo editar este portafolio</b>

<b>1. Tu información</b>
   Abre index.html con cualquier editor de texto y busca
   la sección "DATOS EDITABLES" (al principio del script).
   Ahí están: nombre, título, bio, habilidades, proyectos
   y redes sociales. Todo el sitio se llena desde ahí.

<b>2. Iconos del escritorio</b>
   El array DESKTOP_ICONS del script decide qué apps
   aparecen y en qué orden.

<b>3. Fondo y colores</b>
   El fondo "aurora" es un SVG inline llamado #wallpaper
   (arriba, en el HTML). Cambia sus degradados para otro
   ambiente; los colores del vidrio están en el CSS bajo
   "ventanas".

<b>4. Publicar</b>
   - Vercel / GitHub Pages: sube el repo a GitHub y conéctalo
     a Vercel con 0 configuración.
   - Netlify: arrastra la carpeta a app.netlify.com/drop.
   No necesita servidor ni build: es un solo archivo ultrarrápido.

<b>5. Con ayuda de IA</b>
   Pídele a tu agente que edite la sección DATOS EDITABLES
   por ti, o que lo convierta a Next.js cuando quieras escalar.</div>`;
}

const APPS = {
  about:    { titulo: 'Sobre mí',                   icono: 'user',     w: 560, h: 400, minW: 430, minH: 330, render: renderAbout },
  projects: { titulo: 'Proyectos',                  icono: 'folder',   w: 660, h: 480, minW: 470, minH: 340, render: renderProjects },
  skills:   { titulo: 'Índice de experiencia',      icono: 'computer', w: 580, h: 460, minW: 460, minH: 360, render: renderSkills },
  contact:  { titulo: 'Contacto',                   icono: 'mail',     w: 500, h: 400, minW: 420, minH: 320, render: renderContact },
  readme:   { titulo: 'LÉEME.txt — Bloc de notas',  icono: 'notepad',  w: 570, h: 440, minW: 420, minH: 300, render: renderReadme },
};

/* ============================================================
   GESTOR DE VENTANAS (crear, enfocar, arrastrar, redimensionar,
   minimizar, maximizar, cerrar)
   ============================================================ */
const desktop = document.getElementById('desktop');
const taskButtons = document.getElementById('task-buttons');
const openWins = new Map();   // appId -> estado de la ventana
let zTop = 100;
let cascade = 0;
const coarse = matchMedia('(pointer: coarse)').matches;
const TASKBAR = 44;

function deskSize(){
  return { w: desktop.clientWidth, h: desktop.clientHeight };
}

function focusWin(win){
  if (win.minimized){ win.minimized = false; win.el.classList.remove('minimized'); }
  win.el.style.zIndex = ++zTop;
  openWins.forEach(w => w.el.classList.toggle('active', w === win));
  updateTaskButtons();
}

function openApp(appId, origin){
  if (openWins.has(appId)){ focusWin(openWins.get(appId)); return; }
  const app = APPS[appId];
  if (!app) return;

  const d = deskSize();
  const el = document.createElement('section');
  el.className = 'aero-window opening';
  el.innerHTML = `
    <header class="titlebar">
      <div class="win-title">${svgIcon(app.icono, 16)}<span>${esc(app.titulo)}</span></div>
      <div class="wbtn-group">
        <button class="wbtn" data-act="min" title="Minimizar" aria-label="Minimizar">${GLYPHS.min}</button>
        <button class="wbtn" data-act="max" title="Maximizar" aria-label="Maximizar">${GLYPHS.max}</button>
        <button class="wbtn wbtn-close" data-act="close" title="Cerrar" aria-label="Cerrar">${GLYPHS.close}</button>
      </div>
    </header>
    <div class="window-body"><div class="app-content">${app.render()}</div></div>
    <div class="resizer" title="Redimensionar"></div>`;

  // tamaño y posición (cascada; en pantallas chicas casi maximizada)
  let w = Math.min(app.w, d.w - 16);
  let h = Math.min(app.h, d.h - TASKBAR - 14);
  let x, y;
  if (d.w < 700){ x = 4; y = 4; }
  else if (openWins.size === 0){ x = Math.round((d.w - w) / 2); y = Math.round((d.h - TASKBAR - h) / 2) - 14; }
  else { const off = (cascade++ % 6) * 26; x = 70 + off; y = 40 + off; }
  x = clamp(x, 4, Math.max(4, d.w - w - 6));
  y = clamp(y, 4, Math.max(4, d.h - TASKBAR - h - 6));

  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });

  // origen de la animación de apertura: desde el icono o botón que la lanzó
  if (origin){
    const r = el.getBoundingClientRect();
    el.style.transformOrigin = `${origin.x - r.left}px ${origin.y - r.top}px`;
  }
  desktop.appendChild(el);
  setTimeout(() => el.classList.remove('opening'), 220);

  const win = { appId, el, minimized: false, maximized: false, prev: null, taskBtn: null };
  openWins.set(appId, win);

  // eventos
  el.addEventListener('pointerdown', () => focusWin(win));
  el.addEventListener('click', e => {
    const btn = e.target.closest('.wbtn');
    if (!btn) return;
    if (btn.dataset.act === 'min') minimizeWin(win);
    else if (btn.dataset.act === 'max') toggleMax(win);
    else closeWin(win);
  });

  const tb = el.querySelector('.titlebar');
  tb.addEventListener('dblclick', e => { if (!e.target.closest('.wbtn-group')) toggleMax(win); });
  tb.addEventListener('pointerdown', e => startDrag(e, win, tb));
  el.querySelector('.resizer').addEventListener('pointerdown', e => startResize(e, win));

  addTaskButton(win);
  focusWin(win);

  // barras de habilidades animadas
  if (appId === 'skills'){
    void el.offsetWidth;
    setTimeout(() => {
      el.querySelectorAll('.bar-fill').forEach(b => { b.style.width = b.dataset.w + '%'; });
    }, 60);
  }
  return win;
}

function startDrag(e, win, tb){
  if (e.button !== 0 || e.target.closest('.wbtn-group')) return;
  if (win.maximized) return;
  const dr = desktop.getBoundingClientRect();
  const r = win.el.getBoundingClientRect();
  const ox = e.clientX - r.left, oy = e.clientY - r.top;
  win.el.classList.add('dragging');
  tb.setPointerCapture(e.pointerId);
  const onMove = ev => {
    let x = ev.clientX - dr.left - ox;
    let y = ev.clientY - dr.top - oy;
    x = clamp(x, 110 - r.width, dr.width - 90);
    y = clamp(y, 0, dr.height - TASKBAR - 30);
    win.el.style.left = Math.round(x) + 'px';
    win.el.style.top = Math.round(y) + 'px';
  };
  const stop = () => {
    win.el.classList.remove('dragging');
    tb.removeEventListener('pointermove', onMove);
    tb.removeEventListener('pointerup', stop);
    tb.removeEventListener('pointercancel', stop);
  };
  tb.addEventListener('pointermove', onMove);
  tb.addEventListener('pointerup', stop);
  tb.addEventListener('pointercancel', stop);
}

function startResize(e, win){
  if (e.button !== 0) return;
  e.preventDefault();
  const app = APPS[win.appId];
  const handle = e.currentTarget;
  const r = win.el.getBoundingClientRect();
  const d = deskSize();
  win.el.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
  const onMove = ev => {
    const w = clamp(ev.clientX - r.left, app.minW || 340, d.w - r.left - 2);
    const h = clamp(ev.clientY - r.top, app.minH || 240, d.h - TASKBAR - r.top - 2);
    win.el.style.width = Math.round(w) + 'px';
    win.el.style.height = Math.round(h) + 'px';
  };
  const stop = () => {
    win.el.classList.remove('dragging');
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', stop);
    handle.removeEventListener('pointercancel', stop);
  };
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

function toggleMax(win){
  const d = deskSize();
  const el = win.el;
  el.classList.add('anim');
  if (!win.maximized){
    win.prev = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    Object.assign(el.style, { left: '0px', top: '0px', width: d.w + 'px', height: (d.h - TASKBAR) + 'px' });
    win.maximized = true;
    el.classList.add('maximized');
    el.querySelector('[data-act="max"]').innerHTML = GLYPHS.restore;
  } else {
    const p = win.prev || { x: 60, y: 40, w: 560, h: 420 };
    Object.assign(el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' });
    win.maximized = false;
    el.classList.remove('maximized');
    el.querySelector('[data-act="max"]').innerHTML = GLYPHS.max;
  }
  setTimeout(() => el.classList.remove('anim'), 230);
}

function minimizeWin(win){
  win.minimized = true;
  win.el.style.transformOrigin = '50% 100%';
  win.el.classList.add('minimized');
  updateTaskButtons();
}

function closeWin(win){
  win.el.classList.add('closing');
  if (win.taskBtn) win.taskBtn.remove();
  openWins.delete(win.appId);
  setTimeout(() => {
    win.el.remove();
    let top = null;
    openWins.forEach(w => { if (!w.minimized && (!top || +w.el.style.zIndex > +top.el.style.zIndex)) top = w; });
    if (top) focusWin(top); else updateTaskButtons();
  }, 160);
}

/* ============================================================
   BARRA DE TAREAS Y MENÚ INICIO
   ============================================================ */
function addTaskButton(win){
  const app = APPS[win.appId];
  const btn = document.createElement('button');
  btn.className = 'task-btn';
  btn.innerHTML = `${svgIcon(app.icono, 19)}<span class="tb-label">${esc(app.titulo)}</span>`;
  btn.addEventListener('click', () => {
    if (win.minimized) focusWin(win);
    else if (win.el.classList.contains('active')) minimizeWin(win);
    else focusWin(win);
  });
  win.taskBtn = btn;
  taskButtons.appendChild(btn);
}

function updateTaskButtons(){
  openWins.forEach(w => {
    if (w.taskBtn) w.taskBtn.classList.toggle('active', !w.minimized && w.el.classList.contains('active'));
  });
}

/* iconos del escritorio */
const iconCol = document.getElementById('icon-col');
DESKTOP_ICONS.forEach(appId => {
  const app = APPS[appId];
  const el = document.createElement('div');
  el.className = 'dicon';
  el.tabIndex = 0;
  el.innerHTML = `${svgIcon(app.icono, 48)}<span class="dlabel">${esc(app.titulo.split(' — ')[0])}</span>`;
  el.dataset.app = appId;
  el.addEventListener('click', e => {
    document.querySelectorAll('.dicon.selected').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    if (coarse || e.detail > 1) openApp(appId, { x: e.clientX, y: e.clientY });
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') openApp(appId); });
  iconCol.appendChild(el);
});

/* menú inicio */
const startMenu = document.getElementById('start-menu');
startMenu.innerHTML = `
  <div class="sm-cols">
    <div class="sm-left">
      ${DESKTOP_ICONS.map(id => `
        <div class="sm-item" data-app="${id}">${svgIcon(APPS[id].icono, 30)}<span>${esc(APPS[id].titulo)}</span></div>`).join('')}
      <div class="sm-sep"></div>
      <div class="sm-item sm-allprograms" id="sm-all">Todos los programas&nbsp;&nbsp;▸</div>
      <div class="sm-search">${svgIcon('search', 14)}<input type="text" placeholder="Buscar programas..." id="sm-q" aria-label="Buscar programas"></div>
    </div>
    <div class="sm-right">
      <div class="sm-user">${svgIcon('user', 46)}<div><b>${esc(DATA.nombre)}</b><small>Portafolio en línea</small></div></div>
      <span class="sm-link" data-app="about">Mi sitio</span>
      <span class="sm-link" data-app="projects">Mis proyectos</span>
      <span class="sm-link" data-app="contact">Contacto</span>
      <span class="sm-link" data-app="readme">Ayuda (LÉEME)</span>
      <button class="sm-shutdown" id="sm-shutdown">${svgIcon('power', 18)}<span>Apagar</span></button>
    </div>
  </div>`;

startMenu.addEventListener('click', e => {
  const item = e.target.closest('[data-app]');
  if (item){ openApp(item.dataset.app); toggleStartMenu(false); }
});
startMenu.querySelector('#sm-all').addEventListener('click', () => openApp('readme'));
startMenu.querySelector('#sm-shutdown').addEventListener('click', () => {
  toggleStartMenu(false);
  document.getElementById('shutdown-screen').classList.add('show');
});
document.getElementById('shutdown-screen').addEventListener('click', e => e.currentTarget.classList.remove('show'));

const smInput = document.getElementById('sm-q');
smInput.addEventListener('input', () => {
  const q = smInput.value.trim().toLowerCase();
  startMenu.querySelectorAll('.sm-item[data-app]').forEach(it => {
    it.style.display = it.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
smInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    const first = [...startMenu.querySelectorAll('.sm-item[data-app]')].find(it => it.style.display !== 'none');
    if (first){ openApp(first.dataset.app); toggleStartMenu(false); }
  }
});

const startButton = document.getElementById('start-button');
startButton.innerHTML = svgIcon('startOrb', 34);
function toggleStartMenu(force){
  const show = force !== undefined ? force : !startMenu.classList.contains('open');
  startMenu.classList.toggle('open', show);
  if (show){
    smInput.value = '';
    startMenu.querySelectorAll('.sm-item[data-app]').forEach(it => it.style.display = '');
    setTimeout(() => smInput.focus(), 50);
  }
}
startButton.addEventListener('click', e => { e.stopPropagation(); toggleStartMenu(); });
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#start-menu, #start-button')) toggleStartMenu(false);
  if (!e.target.closest('.dicon')) document.querySelectorAll('.dicon.selected').forEach(i => i.classList.remove('selected'));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleStartMenu(false); });

/* reloj */
function tick(){
  const now = new Date();
  document.getElementById('clk-time').textContent = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('clk-date').textContent = now.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
tick();
setInterval(tick, 10000);

/* arranque: abre "Sobre mí" para recibir al visitante */
setTimeout(() => openApp('about'), 450);
</script>
